name: Deploy to IONOS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Deploy to IONOS via SFTP
        run: |
          apt-get update && apt-get install -y sshpass
          sshpass -p '${{ secrets.IONOS_PASSWORD }}' sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null << 'SFTP_EOF'
          open sftp://u85031456@home626242321.1and1-data.host
          cd /tainamix_new
          lcd ./dist
          mput -r *
          quit
          SFTP_EOF