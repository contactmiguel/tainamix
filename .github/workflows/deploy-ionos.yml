name: Deploy to IONOS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Deploy to IONOS via SFTP
        run: |
          apt-get update && apt-get install -y rsync sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 home626242321.1and1-data.host >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -p '${{ secrets.IONOS_PASSWORD }}' rsync -rvz --delete -e 'ssh -p 22' ./dist/ u85031456@home626242321.1and1-data.host:/tainamix_new/