name: Deploy to IONOS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Deploy to IONOS via SFTP
        run: |
          apt-get update && apt-get install -y lftp
          lftp -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; open -u u85031456,${{ secrets.IONOS_PASSWORD }} sftp://home626242321.1and1-data.host; mirror -R ./dist /tainamix_new; quit"