name: Deploy to IONOS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Deploy to IONOS via SFTP
        uses: milansobota/action-sftp-upload@master
        with:
          host: home626242321.1and1-data.host
          port: 22
          username: u85031456
          password: ${{ secrets.IONOS_PASSWORD }}
          local_dir: './dist/*'
          remote_dir: '/tainamix_new'