name: Deploy to IONOS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Build
        run: |
          npm install
          npm run build
      
      - name: Deploy to IONOS via FTP
        run: |
          cd ./dist
          find . -type f | while read file; do
            dir=$(dirname "$file")
            curl -u u85031456:${{ secrets.IONOS_PASSWORD }} --create-dirs -T "$file" ftp://home626242321.1and1-data.host/tainamix_new/$file
          done